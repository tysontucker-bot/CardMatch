<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Card Match</title>
<meta name="theme-color" content="#eef3fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Match">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FB; --surface:#FFFFFF; --ink:#1C2A4A; --muted:#55658A; --line:#C9D6E8; --accent:#2F6BED; --accent-ink:#fff;
  --sun:#FFC92E; --good:#1C9152; --goodbg:#DDF5E7; --bad:#D2374F; --tile:#B9C8DE;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111A2C; --surface:#1B2741; --ink:#EAF0FA; --muted:#9DB0CF; --line:#2E3C5A; --accent:#6C9BFF; --accent-ink:#0E1626; --sun:#FFD45C; --good:#4CD18A; --goodbg:#173A2A; --bad:#FF7088; --tile:#34456A; }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:22px 18px 70px}
.stack>*+*{margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:2rem}
.sub{color:var(--muted);margin:4px 0 0}
.meta{color:var(--muted);font-size:.92rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
label.f{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:44px}
textarea{min-height:140px;resize:vertical;font-family:inherit}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.who{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.whob{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px;font-size:1.05rem}
.whob.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.whob.add{border-style:dashed;color:var(--muted)}
.prog{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.prog h3{font-size:1.2rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chip.ok{border-color:var(--good);color:var(--good)}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 13px;font-weight:700;cursor:pointer;min-height:44px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.veil{position:fixed;inset:0;background:rgba(10,16,30,.55);display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}
.veil .panel{width:min(560px,96vw);max-height:90vh;overflow:auto}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{font-size:1.7rem;width:50px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.emopick button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tgt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--bg)}
.tcard .pic{width:100%;aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:8px;overflow:hidden}
.tcard img{max-width:100%;max-height:100%;object-fit:contain}
.picres{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.picres button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px;cursor:pointer;aspect-ratio:1}
.picres button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.picres img{width:100%;height:100%;object-fit:contain}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.overflow{overflow-x:auto}
.yes{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
details summary{cursor:pointer;font-weight:700;min-height:32px}
.pchart{width:300px;max-width:100%;height:auto}
.pchart text{font-size:10px;fill:var(--muted)}
.pchart .pgoal{stroke:var(--good);stroke-dasharray:4 4;stroke-width:1}
.pchart .pg{fill:var(--good)}.pchart .pm{fill:var(--sun)}.pchart .pl{fill:var(--bad)}.pchart .pp{fill:var(--muted);opacity:.55}

/* ---- student screen ---- */
body.playing{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.play{min-height:100vh;display:flex;flex-direction:column;padding:14px 18px 24px;max-width:1150px;margin:0 auto}
.pbar{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:15px;height:15px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}.dot.done{background:var(--good)}.dot.miss{background:var(--sun)}
.lock{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:transparent;cursor:pointer;touch-action:none;flex:none}
.lock svg{position:absolute;inset:0}
.lock .ico{position:relative;font-size:20px;opacity:.55}
.trial{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:20px}
.sample{display:flex;flex-direction:column;align-items:center;gap:8px}
.cards{display:flex;flex-wrap:wrap;gap:var(--gap,18px);justify-content:center;width:100%;padding:0 2vw}
.cards.sp-close{--gap:18px}
.cards.sp-medium{--gap:clamp(36px,6vw,80px)}
.cards.sp-wide{--gap:clamp(70px,14vw,220px)}
.cards.sp-edges{justify-content:space-between;--gap:24px;padding:0 1vw}
.cards.sp-edges.n3,.cards.sp-edges.n4,.cards.sp-edges.n5{justify-content:space-evenly}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:3px solid var(--tile);border-bottom-width:9px;border-radius:20px;
  width:clamp(130px,22vw,220px);aspect-ratio:1;padding:10px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.card.big{width:clamp(150px,26vw,250px);cursor:default;border-color:var(--accent);border-bottom-width:3px}
.card:not(.big):active{transform:translateY(4px);border-bottom-width:5px}
.card img{max-width:88%;max-height:70%;object-fit:contain;pointer-events:none}
.card .txt{font-family:Andika,"Atkinson Hyperlegible",system-ui,sans-serif;font-size:clamp(1.6rem,4.5vw,3rem);line-height:1.1;text-align:center;word-break:break-word}
.card .txt.huge{font-size:clamp(3rem,9vw,5.5rem)}
.card .cap{font-size:1rem;font-weight:700;color:var(--muted)}
.card.ok{border-color:var(--good);background:var(--goodbg)}
.card.hint{border-color:var(--sun);box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 45%,transparent)}
.card.no{opacity:.35}
.qty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:80%}
.qty i{aspect-ratio:1;border-radius:50%;background:var(--accent)}
.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.big2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.big2 h1{font-size:clamp(2.2rem,6vw,3.6rem)}
.start{font-family:"Fredoka",system-ui,sans-serif;font-size:2rem;padding:20px 60px;border-radius:24px;border:0;border-bottom:9px solid color-mix(in srgb,var(--accent) 65%,#000);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.start:active{transform:translateY(4px);border-bottom-width:5px}
.tokens{display:flex;gap:6px}
.tok{width:30px;height:30px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:1.1rem}
.tok.on{border:3px solid var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--surface))}
.rfwrap{position:fixed;inset:0;z-index:95;background:#0b1020;touch-action:none;transition:opacity .35s}
.rfwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.rfwrap.rfout{opacity:0}
.rftimer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:52px;height:52px;pointer-events:none}
.rfchoose{display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2a2f6b,#0b1020)}
.rfboard{text-align:center;color:#fff;display:flex;flex-direction:column;gap:16px;align-items:center;padding:20px}
.rfboard h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.rfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;width:min(860px,94vw)}
.rfgrid button{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35);border-bottom-width:8px;color:#fff;border-radius:22px;padding:18px 10px;font-family:"Fredoka",system-ui,sans-serif;font-size:1.4rem;cursor:pointer}
.rfgrid button span{font-size:3.6rem;line-height:1}
.rfpick{display:flex;flex-direction:column;gap:8px}
.rfopt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.rfe{font-size:1.8rem}
.dim{opacity:.55}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const fmtDate = t => { try { return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch { return ""; } };

/* ---------- storage (this device) ---------- */
const KEY = "cardmatch.v1";
let DB = { students: {}, settings: { source: "arasaac", gsKey: "", sound: true, read: true } };
try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.students) DB = Object.assign(DB, d, { settings: Object.assign(DB.settings, d.settings || {}) }); } catch {}
DB.deleted = DB.deleted || {};
DB.groups = DB.groups || {};
DB.settings.sync = Object.assign({ owner: "", repo: "", token: "" }, DB.settings.sync || {});
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; } catch { return false; } };
const persist = () => { if (saveLocal()) { scheduleSync(); return true; } try { throw 0; } catch { uiAlert("This iPad is out of storage space. Export a backup and remove old students."); return false; } };
const settings = { get sound() { return DB.settings.sound; }, get read() { return DB.settings.read; } };


/* ---------- sync through a private GitHub repository ---------- */
const SYNC_FILE = "cardmatch-data.json";
const SY = { state: "off", at: 0, msg: "" };
let syncTimer = 0, syncing = false, syncAgain = false;
const syncOn = () => { const s = DB.settings.sync; return !!(s.owner && s.repo && s.token); };
const b64e = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = b64 => new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, "")), c => c.charCodeAt(0)));
function gh(path, opt) {
  const s = DB.settings.sync; opt = opt || {};
  return fetch(`https://api.github.com/repos/${encodeURIComponent(s.owner.trim())}/${encodeURIComponent(s.repo.trim())}${path}`, Object.assign({ cache: "no-store" }, opt, { headers: Object.assign({ Authorization: `Bearer ${s.token.trim()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }, opt.headers || {}) }));
}
function ghError(r) {
  if (r.status === 401) return "the key isn't valid or has expired. Make a new one.";
  if (r.status === 403) return "the key doesn't have permission. It needs Contents: Read and write on the data repo.";
  if (r.status === 404) return "the repo wasn't found. Check the username and repo name, and that the key includes this repo.";
  return `GitHub said ${r.status}.`;
}
async function pullRemote() {
  const r = await gh(`/contents/${SYNC_FILE}`);
  if (r.status === 404) { const repo = await gh(""); if (!repo.ok) throw new Error(ghError(repo)); return { data: null, sha: null }; }
  if (!r.ok) throw new Error(ghError(r));
  const j = await r.json();
  let text = j.content ? b64d(j.content) : "";
  if (!text && j.size > 0) { const r2 = await gh(`/contents/${SYNC_FILE}`, { headers: { Accept: "application/vnd.github.raw" } }); if (!r2.ok) throw new Error(ghError(r2)); text = await r2.text(); }
  return { data: text ? JSON.parse(text) : null, sha: j.sha };
}
/* merge another copy in without losing anything: sessions are kept from both; for edits, the newest wins */
function mergeInto(L, R) {
  if (!R || !R.students) return;
  const del = Object.assign({}, L.deleted || {});
  for (const [k, t] of Object.entries(R.deleted || {})) del[k] = Math.max(del[k] || 0, t);
  L.deleted = del;
  for (const [id, rs] of Object.entries(R.students)) {
    const ls = L.students[id];
    if (!ls) { L.students[id] = rs; continue; }
    const newer = (rs.updatedAt || 0) > (ls.updatedAt || 0) ? rs : ls;
    const dp = Object.assign({}, ls.deletedProgs || {});
    for (const [k, t] of Object.entries(rs.deletedProgs || {})) dp[k] = Math.max(dp[k] || 0, t);
    const pm = new Map();
    for (const prog of [...(newer.programs || []), ...((newer === rs ? ls : rs).programs || [])]) { const cur = pm.get(prog.id); if (!cur || (prog.updatedAt || 0) > (cur.updatedAt || 0)) pm.set(prog.id, prog); }
    const programs = [...pm.values()].filter(x => !(dp[x.id] && dp[x.id] >= (x.updatedAt || 0)));
    const hm = new Map();
    for (const h of [...(ls.history || []), ...(rs.history || [])]) { const k = h.at + ":" + h.prog; const cur = hm.get(k); if (!cur || (h.editedAt || 0) > (cur.editedAt || 0)) hm.set(k, h); }
    L.students[id] = Object.assign({}, newer, { programs, deletedProgs: dp, history: [...hm.values()].sort((a, b) => a.at - b.at).slice(-1500) });
  }
  for (const [id, t] of Object.entries(del)) { const st = L.students[id]; if (st && t >= (st.updatedAt || 0)) delete L.students[id]; }
  L.groups = L.groups || {};
  for (const [id, g] of Object.entries(R.groups || {})) { const cur = L.groups[id]; if (!cur || (g.updatedAt || 0) > (cur.updatedAt || 0)) L.groups[id] = g; }
  for (const [id, g] of Object.entries(L.groups)) { const t = del["g:" + id]; if (t && t >= (g.updatedAt || 0)) delete L.groups[id]; }
}
const payload = () => JSON.stringify({ v: 1, students: DB.students, deleted: DB.deleted || {}, groups: DB.groups || {} });
function scheduleSync() { if (!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 4000); }
async function syncNow() {
  if (!syncOn()) { SY.state = "off"; return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; SY.state = "busy"; showSync();
  try {
    let done = false;
    for (let attempt = 0; attempt < 3 && !done; attempt++) {
      const { data, sha } = await pullRemote();
      const before = payload();
      if (data) mergeInto(DB, data);
      saveLocal();
      const mine = payload();
      if (data && mine === JSON.stringify({ v: 1, students: data.students || {}, deleted: data.deleted || {}, groups: data.groups || {} })) { done = true; if (mine !== before && S.view !== "play") render(); break; }
      const body = { message: `Card Match sync ${new Date().toISOString()}`, content: b64e(mine) };
      if (sha) body.sha = sha;
      const r = await gh(`/contents/${SYNC_FILE}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (r.ok) { done = true; if (mine !== before && S.view !== "play") render(); }
      else if (r.status !== 409 && r.status !== 422) throw new Error(ghError(r));
    }
    if (!done) throw new Error("another device was saving at the same time. It will try again.");
    SY.state = "ok"; SY.at = Date.now(); SY.msg = "";
  } catch (e) {
    SY.state = "error"; SY.msg = navigator.onLine === false ? "no internet connection. Changes are saved on this device and will sync later." : (e && e.message) || "something went wrong.";
  } finally {
    syncing = false; showSync();
    if (syncAgain) { syncAgain = false; setTimeout(syncNow, 1500); }
  }
}
function syncLabel() {
  if (!syncOn()) return `<button class="btn quiet" data-a="settings" style="min-height:0;padding:4px 8px">☁️ Set up sync</button>`;
  if (SY.state === "busy") return "☁️ Syncing…";
  if (SY.state === "error") return `<span style="color:var(--bad)">☁️ Not synced: ${esc(SY.msg)}</span> <button class="btn quiet" data-a="syncnow" style="min-height:0;padding:4px 8px">Try again</button>`;
  if (SY.state === "ok") { const m = Math.round((Date.now() - SY.at) / 60000); return `☁️ Synced ${m < 1 ? "just now" : m === 1 ? "1 minute ago" : m + " minutes ago"} <button class="btn quiet" data-a="syncnow" style="min-height:0;padding:4px 8px">Sync now</button>`; }
  return `☁️ <button class="btn quiet" data-a="syncnow" style="min-height:0;padding:4px 8px">Sync now</button>`;
}
function showSync() { const el = document.getElementById("syncline"); if (el) el.innerHTML = syncLabel(); }
document.addEventListener("click", e => { const b = e.target.closest('[data-a="syncnow"]'); if (b) { e.stopPropagation(); syncNow(); } }, true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view !== "play") syncNow(); });
addEventListener("online", () => scheduleSync());
setInterval(() => { if (document.visibilityState === "visible" && S.view !== "play" && syncOn()) syncNow(); else showSync(); }, 120000);

/* ---------- in-page dialogs ---------- */
function uiDialog(message, okLabel, cancelLabel) {
  return new Promise(res => {
    const v = document.createElement("div"); v.className = "veil"; v.style.zIndex = "90";
    v.innerHTML = `<div class="panel stack" role="alertdialog" aria-modal="true" style="max-width:440px"><p style="font-size:1.1rem;margin:0">${esc(message)}</p><div class="row">${cancelLabel ? `<button class="btn" data-x="0">${esc(cancelLabel)}</button>` : ""}<button class="btn primary" data-x="1">${esc(okLabel || "OK")}</button></div></div>`;
    v.addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (!b) return; v.remove(); res(b.dataset.x === "1"); });
    document.body.appendChild(v);
  });
}
const uiConfirm = (m, ok) => uiDialog(m, ok || "Yes", "Cancel");
const uiAlert = m => uiDialog(m, "OK");

/* ---------- sound & speech ---------- */
let actx = null;
function chime() { if (!settings.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const t = actx.currentTime; [660, 880].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; const s = t + i * 0.12; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.22, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.3); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + 0.32); }); } catch {} }
function speak(text) { if (!text || !("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch {} }

/* ---------- matching relationships (same as Cardmaker) ---------- */
const NUMW = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
const REL = [
  { id: "picture-picture", label: "Picture → picture", s: "picture", c: "picture" },
  { id: "picture-word", label: "Picture → printed word", s: "picture", c: "text" },
  { id: "word-picture", label: "Printed word → picture", s: "text", c: "picture" },
  { id: "word-word", label: "Printed word → printed word", s: "text", c: "text" },
  { id: "uppercase-lowercase", label: "Uppercase letter → lowercase letter", s: "text", c: "text", sm: v => v.toUpperCase(), cm: v => v.toLowerCase() },
  { id: "lowercase-uppercase", label: "Lowercase letter → uppercase letter", s: "text", c: "text", sm: v => v.toLowerCase(), cm: v => v.toUpperCase() },
  { id: "letter-letter", label: "Letter → letter", s: "text", c: "text" },
  { id: "number-number", label: "Number → number", s: "text", c: "text" },
  { id: "number-quantity", label: "Number → quantity", s: "text", c: "quantity", sm: v => String(parseInt(v, 10) || 0) },
  { id: "quantity-number", label: "Quantity → number", s: "quantity", c: "text", cm: v => String(parseInt(v, 10) || 0) },
  { id: "numeral-number-word", label: "Numeral → number word", s: "text", c: "text", sm: v => String(parseInt(v, 10) || 0), cm: v => NUMW[parseInt(v, 10)] ?? v },
  { id: "shape-shape", label: "Shape → shape", s: "text", c: "text" },
  { id: "color-color", label: "Color → color", s: "text", c: "text" },
  { id: "object-picture", label: "Object → picture", s: "text", c: "picture" },
  { id: "symbol-symbol", label: "Symbol → symbol", s: "picture", c: "picture" },
  { id: "identical", label: "Identical matching", s: "text", c: "text" },
  { id: "non-identical", label: "Non-identical matching (stimulus -> response)", s: "text", c: "text" }
];
const relOf = id => REL.find(r => r.id === id) || REL[0];
function parseTargets(text) {
  return String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    for (const sep of ["->", "=>", "|"]) if (l.includes(sep)) { const [a, b] = l.split(sep).map(x => x.trim()); if (a && b) return { left: a, right: b }; }
    return { left: l, right: null };
  });
}
function scoreDiff(a, b) { a = String(a).toLowerCase(); b = String(b).toLowerCase(); let d = Math.abs(a.length - b.length); for (let i = 0; i < Math.max(a.length, b.length); i++) if (a[i] !== b[i]) d++; return d; }
function pickDistractors(pool, target, needed, rules) {
  let c = [...new Set(pool.filter(Boolean).map(String))].filter(x => x !== target);
  if (rules.sameLength) c = c.filter(x => x.length === String(target).length);
  if (rules.differentInitial) c = c.filter(x => x.charAt(0).toLowerCase() !== String(target).charAt(0).toLowerCase());
  c = shuffle(c).sort((a, b) => scoreDiff(b, target) - scoreDiff(a, target));
  const out = [], ini = new Set();
  for (const x of c) { if (out.length >= needed) break; const i = x.charAt(0).toLowerCase(); if (rules.uniqueInitials && ini.has(i)) continue; out.push(x); ini.add(i); }
  for (const x of shuffle(pool.filter(Boolean).map(String))) { if (out.length >= needed) break; if (x !== target && !out.includes(x)) out.push(x); }
  return out;
}
/* build one session of trials for a program */
function buildTrials(p) {
  const rel = relOf(p.rel), T = parseTargets(p.targets);
  const live = T.filter(t => !(p.mastered || []).includes(t.left) || p.includeMastered);
  const use = live.length ? live : T;
  if (!use.length) return [];
  const n = Math.max(1, Math.min(60, p.trials || 10));
  let order = [];
  while (order.length < n) order = order.concat(p.order === "inorder" ? use : shuffle(use));
  order = order.slice(0, n);
  if (p.order !== "inorder") for (let i = 1; i < order.length; i++) if (order[i].left === order[i - 1].left) { const j = order.findIndex((t, k) => k > i && t.left !== order[i].left); if (j > 0) [order[i], order[j]] = [order[j], order[i]]; }
  const map = (v, f) => f ? f(String(v)) : String(v);
  return order.map(t => {
    const base = t.right ?? t.left;
    const sample = map(t.left, rel.sm), correct = map(base, rel.cm);
    const pool = T.filter(x => x.left !== t.left).map(x => map(x.right ?? x.left, rel.cm));
    const dis = pickDistractors(pool, correct, Math.max(0, (p.array || 3) - 1), p.rules || {});
    const choices = shuffle([correct, ...dis]);
    const baseOf = v => { const hit = T.find(x => map(x.right ?? x.left, rel.cm) === v); return hit ? (hit.right ?? hit.left) : v; };
    return { target: t.left, sample, sampleBase: t.left, correct, choices: choices.map(v => ({ v, base: baseOf(v) })) };
  });
}

/* ---------- symbols: ARASAAC or Global Symbols ---------- */
const symCache = {};
async function searchSymbols(term) {
  term = String(term || "").trim(); if (!term) return [];
  const src = DB.settings.source;
  const key = src + ":" + term.toLowerCase();
  if (symCache[key]) return symCache[key];
  let out = [];
  const tryAras = async () => {
    const r = await fetch(`https://api.arasaac.org/api/pictograms/en/search/${encodeURIComponent(term)}`);
    if (!r.ok) return [];
    const j = await r.json();
    return (Array.isArray(j) ? j : []).slice(0, 12).map(x => ({ url: `https://static.arasaac.org/pictograms/${x._id}/${x._id}_500.png`, src: "ARASAAC" }));
  };
  const tryGS = async () => {
    const k = DB.settings.gsKey.trim();
    const base = `https://globalsymbols.com/api/v1/labels/search?query=${encodeURIComponent(term)}&language=eng&language_iso_format=639-3&limit=12`;
    const attempts = k ? [[base + `&api_key=${encodeURIComponent(k)}`, {}], [base, { headers: { Authorization: `Bearer ${k}` } }], [base, {}]] : [[base, {}]];
    for (const [url, opt] of attempts) {
      try {
        const r = await fetch(url, opt); if (!r.ok) continue;
        const j = await r.json(); const list = Array.isArray(j) ? j : (j.labels || j.data || j.results || []);
        const found = list.map(x => x && (x.picto && (x.picto.image_url || x.picto.imageUrl) || x.image_url || x.imageUrl)).filter(Boolean).slice(0, 12).map(url => ({ url, src: "Global Symbols" }));
        if (found.length) return found;
      } catch {}
    }
    return [];
  };
  try {
    if (src === "globalsymbols") { out = await tryGS(); if (!out.length) out = await tryAras().catch(() => []); }
    else { out = await tryAras().catch(() => []); if (!out.length && DB.settings.gsKey) out = await tryGS(); }
  } catch { out = []; }
  symCache[key] = out;
  return out;
}
async function picFor(p, term) {
  p.pics = p.pics || {};
  if (p.pics[term] !== undefined) return p.pics[term];
  const r = await searchSymbols(term);
  p.pics[term] = r[0] ? r[0].url : "";
  persist();
  return p.pics[term];
}

/* ---------- reinforcement: schedules + full-screen visual reinforcers ---------- */
const RF_TYPES = [
  ["sparkles", "✨", "Sparkles", "Glowing fireworks and sparkles that follow their finger"],
  ["bubbles", "🫧", "Bubble pop", "Tap bright bubbles to pop them"],
  ["draw", "🖍️", "Draw", "Paint with a glowing rainbow brush"],
  ["numbers", "🔢", "Numbers", "Touch anywhere to drop 1, 2, 3… in order; drag to make a trail; tap one to pop it"],
  ["letters", "🔤", "Letters", "Touch anywhere to drop A, B, C… in order; drag to make a trail; tap one to pop it"]
];
const RF_DEFAULT = { on: false, types: ["sparkles", "bubbles", "draw", "numbers", "letters"], pick: "choose", kind: "FR", n: 3, secs: 60, duration: 15, firstTryOnly: false, countErrorless: true, tokens: true, atEnd: true };
const rfCfg = st => Object.assign({}, RF_DEFAULT, (st && st.reinf) || {});
function rfLabel(c) {
  if (!c.on) return "Off";
  const what = c.firstTryOnly ? "first-try correct answer" : "correct answer";
  const m = { FR: c.n === 1 ? `Every ${what} (FR 1)` : `Every ${c.n} ${what}s (FR ${c.n})`, VR: `About every ${c.n} ${what}s (VR ${c.n})`, FI: `First ${what} after ${c.secs} seconds (FI ${c.secs}s)`, VI: `First ${what} after about ${c.secs} seconds (VI ${c.secs}s)`, END: "Only at the end of the activity" };
  return m[c.kind] + (c.atEnd && c.kind !== "END" ? ", plus at the end" : "");
}
function rfStart(P) {
  if (!P.rcfg || !P.rcfg.on) { P.rf = null; return; }
  const c = P.rcfg;
  P.rf = { count: 0, delivered: 0, lastAt: Date.now() };
  P.rf.target = c.kind === "VR" ? 1 + Math.floor(Math.random() * Math.max(1, 2 * c.n - 1)) : c.n;
  P.rf.wait = c.kind === "VI" ? c.secs * (0.5 + Math.random()) * 1000 : c.secs * 1000;
}
/* called when a question is finished; true means a reinforcer is due now */
function rfCheck(P, item) {
  const c = P.rcfg, R = P.rf; if (!c || !R || c.kind === "END") return false;
  if (item.type === "read") return false;
  if (!c.countErrorless && isErrorless(item)) return false;
  if (c.firstTryOnly && P.wrong[P.idx]) return false;
  R.count++;
  let due = false;
  if (c.kind === "FR") due = R.count >= c.n;
  if (c.kind === "VR") due = R.count >= R.target;
  if (c.kind === "FI" || c.kind === "VI") due = Date.now() - R.lastAt >= R.wait;
  if (due) {
    R.count = 0; R.delivered++; R.lastAt = Date.now();
    if (c.kind === "VR") R.target = 1 + Math.floor(Math.random() * Math.max(1, 2 * c.n - 1));
    if (c.kind === "VI") R.wait = c.secs * (0.5 + Math.random()) * 1000;
  }
  return due;
}
function tokensHTML(P) {
  const c = P.rcfg, R = P.rf;
  if (!c || !R || c.kind !== "FR" || !c.tokens || c.n < 2) return "";
  return `<div class="tokens" aria-label="${R.count} of ${c.n} stars">${Array.from({ length: c.n }, (_, i) => `<span class="tok ${i < R.count ? "on" : ""}">${i < R.count ? "⭐" : ""}</span>`).join("")}</div>`;
}
/* show the reinforcer (with a choice board if set), then call done() */
function rfDeliver(P, done) {
  const c = P.rcfg; const types = c.types.filter(t => RF_TYPES.some(x => x[0] === t));
  if (!types.length) { done(); return; }
